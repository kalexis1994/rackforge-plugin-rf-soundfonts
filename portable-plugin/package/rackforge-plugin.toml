schema_version = 2
id = "org.rackforge.rf-soundfonts"
name = "RF-Soundfonts"
vendor = "RackForge"
version = "0.7.0"
description = "A portable RF-Soundfonts instrument library with a factory grand piano ready to perform."
kind = "instrument"
state_version = 1
capabilities = ["audio_output", "midi_input", "presets", "sample_accurate_automation"]
ui_layouts = ["little@1"]
config_mode = true

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#091413"
accent_color = "#B0E4CC"

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

# CONFIG and PLAY call plugin.preview_resource and plugin.activate_resource and
# send edit_mode. RackForge added them on 22-23 August 2026 while its plugin API
# was still 1.8 and moved to 1.9 the next day, so 1.9 is the first version that
# guarantees them: an older host refuses the plugin at install instead of
# failing when a surface calls them.
[api]
major = 1
minor = 9

[[resources]]
id = "factory-soundfont"
name = "YDP Grand Piano"
kind = "file"
required = true
package_path = "assets/ydp-grand-piano.sf2"

# Installed into private plugin storage; resources are delivered in id order,
# so this bank arrives after the factory one and becomes the playing bank.
[[resources]]
id = "user-soundfont"
name = "RF instrument library"
kind = "file"
required = false
data_path = "banks/user-soundfont.sf2"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
memory_limit_mib = 384
