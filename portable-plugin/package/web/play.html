<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#091413">
    <title>RF-Soundfonts</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="instrument">
      <header>
        <div class="identity"><span>RF</span><strong>SOUNDFONTS</strong></div>
        <p>SOUNDFONT LIBRARY · PORTABLE</p>
      </header>
      <section class="panel">
        <div class="status"><i></i><span data-play-status>READY</span></div>
        <h1 data-sound-title>YDP Grand Piano</h1>
        <p class="subtitle" data-sound-subtitle>The default RackForge acoustic piano.</p>
        <div class="tabs" role="tablist" aria-label="Instrument sections">
          <button class="tab" type="button" role="tab" id="tab-sounds"
                  aria-controls="panel-sounds" aria-selected="true" data-tab="sounds">Sounds</button>
          <button class="tab" type="button" role="tab" id="tab-levels"
                  aria-controls="panel-levels" aria-selected="false" tabindex="-1" data-tab="levels">Levels</button>
        </div>
        <div class="tabpanels">
          <section class="tabpanel" role="tabpanel" id="panel-sounds"
                   aria-labelledby="tab-sounds" data-panel="sounds" data-active>
            <div class="sound-browser" data-sound-browser>
              <strong>Sounds in this bank</strong>
              <div class="sound-list" data-sound-list></div>
            </div>
          </section>
          <section class="tabpanel" role="tabpanel" id="panel-levels"
                   aria-labelledby="tab-levels" data-panel="levels" hidden>
            <div class="volume-card">
              <label for="master-volume">VOLUME</label>
              <input id="master-volume" type="range" min="0" max="1" step="0.01" value="0.9" data-volume disabled>
              <output data-volume-value>—</output>
            </div>
          </section>
        </div>
        <div class="keyboard" aria-hidden="true"></div>
      </section>
      <footer><span>96 VOICE POLYPHONY</span><span>FREEPATS · CC BY 3.0</span></footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
