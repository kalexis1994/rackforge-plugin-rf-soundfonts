[package]
name = "rackforge-rf-soundfonts-portable"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "tga"] }
rackforge-plugin-sdk.workspace = true
rackforge-dsp.workspace = true
rf-soundfonts = { path = "../crates/rf-soundfonts-engine" }
rustysynth.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
