<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#091413">
    <title>RF-Soundfonts</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="play-surface">
    <main class="instrument workstation">
      <header>
        <div class="identity"><span>RF</span><strong>SOUNDFONTS</strong></div>
        <p>PORTABLE SAMPLE WORKSTATION</p>
      </header>
      <section class="play-workspace">
        <aside class="sound-browser" data-sound-browser aria-label="Sound browser">
          <div class="browser-heading">
            <div>
              <span class="section-kicker">LIBRARY</span>
              <strong>Instruments</strong>
            </div>
            <span class="sound-count" data-sound-count>0 SOUNDS</span>
          </div>
          <label class="sound-search">
            <span>Search instruments</span>
            <input type="search" autocomplete="off" placeholder="Search sounds…" data-sound-search>
          </label>
          <div class="sound-list" data-sound-list role="listbox" aria-label="Available sounds"></div>
        </aside>

        <section class="instrument-rack" aria-label="Loaded instrument" data-bank-shell data-bank-layout="studio">
          <div class="rack-toolbar">
            <div class="status" role="status" aria-live="polite">
              <i></i><span data-play-status>READY</span>
            </div>
            <span class="engine-badge" data-bank-engine>WASM · 96 VOICES</span>
          </div>

          <div class="bank-stage" data-bank-stage>
            <div class="bank-artwork" data-bank-module="artwork">
              <img data-bank-artwork alt="" hidden>
              <div class="bank-artwork-shade"></div>
              <span class="bank-edition" data-bank-edition>RF BANK</span>
            </div>

            <div class="instrument-display" data-bank-module="instrument">
              <span class="section-kicker" data-bank-kicker>LOADED INSTRUMENT</span>
              <h1 data-sound-title>YDP Grand Piano</h1>
              <p class="subtitle" data-sound-subtitle>The default RackForge acoustic piano.</p>
              <div class="display-meta">
                <span data-active-bank>Factory bank</span>
                <span data-active-format>SF2</span>
              </div>
            </div>
          </div>

          <div class="control-deck" data-bank-module="controls">
            <div class="control-heading">
              <span class="section-kicker" data-bank-control-kicker>CHANNEL</span>
              <strong data-bank-control-title>Output</strong>
            </div>
            <div class="volume-card">
              <label for="master-volume">MASTER</label>
              <input id="master-volume" type="range" min="0" max="1" step="0.01"
                     value="0.9" data-volume disabled>
              <output data-volume-value>—</output>
            </div>
          </div>

          <div class="keyboard" data-bank-module="keyboard" aria-hidden="true"></div>
        </section>
      </section>
      <footer><span data-bank-footer>RACKFORGE INSTRUMENT</span><span data-bank-credit>FREEPATS · CC BY 3.0</span></footer>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
