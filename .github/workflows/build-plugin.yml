name: Build RF-Soundfonts plugin

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-rf-soundfonts-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  portable_plugin:
    name: Portable .rfplugin
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        working-directory: rf-soundfonts

    steps:
      - name: Check out RF-Soundfonts
        uses: actions/checkout@v6
        with:
          path: rf-soundfonts

      - name: Check out pinned public RackForge SDK
        uses: actions/checkout@v6
        with:
          repository: kalexis1994/rackforge
          ref: 0fd1b678a3f3c15eb5107d28151440fa423b712c
          path: rackforge
          persist-credentials: false

      - name: Use the pinned local SDK checkout
        shell: pwsh
        run: Copy-Item .cargo/config.toml.example .cargo/config.toml

      - name: Install native test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config

      - name: Set up Rust and WebAssembly target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rf-soundfonts/target
            rackforge/target
          key: ${{ runner.os }}-rf-soundfonts-${{ hashFiles('rf-soundfonts/Cargo.lock', 'rackforge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rf-soundfonts-

      - name: Test workspace
        shell: pwsh
        run: cargo test --workspace --locked

      - name: Build portable plugin package
        id: package
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw portable-plugin/package/rackforge-plugin.toml
          if ($manifest -notmatch '(?m)^version = "([^"]+)"\s*$') {
            throw 'Could not read the plugin version from rackforge-plugin.toml.'
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match plugin version $version."
          }
          $artifactName = "RF-Soundfonts-$version-$env:GITHUB_SHA"
          $output = Join-Path $PWD 'artifacts/RF-Soundfonts.rfplugin'
          ./tools/build-portable-package.ps1 `
            -RackForgeRoot (Join-Path (Split-Path $PWD) 'rackforge') `
            -Output $output
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $output).Hash.ToLowerInvariant()
          "$digest  $([System.IO.Path]::GetFileName($output))" |
            Set-Content -LiteralPath "$output.sha256" -NoNewline
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=$output" >> $env:GITHUB_OUTPUT

      - name: Upload RF-Soundfonts package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: portable_plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.portable_plugin.outputs.artifact_name }}
          path: release

      - name: Verify release checksum
        shell: bash
        working-directory: release
        run: sha256sum --check RF-Soundfonts.rfplugin.sha256

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.portable_plugin.outputs.version }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$REPOSITORY"
          else
            release_flags=()
            if [[ "$tag" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$tag" release/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "RF-Soundfonts v$VERSION" \
              --generate-notes \
              "${release_flags[@]}"
          fi
