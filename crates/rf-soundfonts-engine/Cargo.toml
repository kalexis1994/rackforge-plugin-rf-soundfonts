[package]
name = "rf-soundfonts"
description = "Sample engine for the RackForge RF-Soundfonts plugin: DLS collections, SFZ instruments, WAV and FLAC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
claxon = "0.4.3"
flate2 = "1.1.9"
hound.workspace = true
quick-xml = "0.41.0"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.10"
libc = "0.2"
midir = "0.11"

[lib]
name = "rf_soundfonts"
path = "src/lib.rs"

[[bin]]
name = "rf-soundfonts"
path = "src/main.rs"

[[bin]]
name = "rf-soundfonts-live"
path = "src/bin/rf_soundfonts_live.rs"
