schema_version = 1
id = "org.rackforge.rf-soundfonts"
name = "RF-Soundfonts"
vendor = "RackForge"
version = "0.2.0"
kind = "instrument"
state_version = 1
capabilities = ["audio_output", "midi_input", "presets", "sample_accurate_automation"]
ui_layouts = ["little@1"]
config_mode = true

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

[api]
major = 1
minor = 7

[[resources]]
id = "factory-soundfont"
name = "YDP Grand Piano SoundFont"
kind = "file"
required = true
package_path = "assets/ydp-grand-piano.sf2"

[[resources]]
id = "user-library"
name = "SoundFont library"
kind = "directory"
required = false

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
memory_limit_mib = 384
