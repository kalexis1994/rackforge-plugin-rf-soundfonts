schema_version = 2
id = "org.rackforge.rf-soundfonts"
name = "RF-Soundfonts"
vendor = "RackForge"
version = "0.5.14"
description = "A library instrument for discovering and playing DLS and SFZ sample collections."
kind = "instrument"
state_version = 4
capabilities = [
    "audio_output",
    "midi_input",
    "presets",
    "state",
    "sample_accurate_automation",
]
ui_layouts = ["little@1"]
config_mode = true

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#091413"
accent_color = "#B0E4CC"

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

[api]
major = 1
minor = 5

# Either source can drive the plugin, so neither is required on its own. A
# host that has only an SFZ library installed should still load the instrument
# rather than refuse it over a DLS bank it will never use.
[[resources]]
id = "dls-bank"
name = "DLS Sound Bank"
kind = "file"
required = false
data_path = "banks/gm.dls"

# A directory, not a file: an SFZ instrument is a text document plus the folder
# of samples it references, and the two are useless apart. Each library the
# player installs becomes a folder inside this one.
[[resources]]
id = "sfz-library"
name = "SFZ Instrument Library"
kind = "directory"
required = false
data_path = "sfz"

[binaries]
linux-aarch64 = "lib/librackforge_rf_soundfonts.so"
linux-x86_64 = "lib/librackforge_rf_soundfonts.so"
windows-x86_64 = "lib/rackforge_rf_soundfonts.dll"
